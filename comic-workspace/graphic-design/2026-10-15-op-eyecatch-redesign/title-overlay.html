</style></head><body><main><small>TITLE OVERLAY / ALPHA MASTER</small><h1>新世界之魔物猎手 · 圆环版标题</h1><p>沿用第一版的圆环展开、字形环绕与标题汇聚，补上呼应圆环的退场。<br>总长 5 秒，字形保留白色描边。灰格仅用于显示透明区域，不会出现在透明成片里。</p><div id="stage"><canvas id="film" width="1920" height="1080"></canvas></div><div class="bar"><button id="play">循环播放</button><input id="seek" type="range" min="0" max="5" value="2.8" step="0.0166667"><span id="time">2.80 / 5.00</span><select id="background"><option value="grid">灰格预览</option><option value="dark">深色底预览</option><option value="white">白底预览</option></select><a class="primary" href="exports/Title-overlay-4K60-alpha.mov" download>下载 4K 透明 MOV</a></div><footer>圆环展开与字形环绕 → 汇聚成标题 → 停留 → 回环收拢退场。透明背景，无音轨。<br><a href="exports/Title-overlay-1080p60-alpha.mov" download>1080p 透明 MOV</a> · <a href="exports/Title-overlay-hold-4K.png" download>静止透明标题</a> · <a href="watch.html?rev=ring-overlay-4">返回成片页</a></footer></main><script src="motion.js"></script><script>
let t=2.8,running=false,start=0,raf;const play=document.querySelector('#play'),seek=document.querySelector('#seek');function draw(){film.render('overlay',t,1920,1080);seek.value=t;document.querySelector('#time').textContent=`${t.toFixed(2)} / 5.00`}function stop(){running=false;cancelAnimationFrame(raf);play.textContent='循环播放'}function tick(now){if(!running)return;t=((now-start)/1000)%5;draw();raf=requestAnimationFrame(tick)}play.onclick=async()=>{await film.ready;if(running){stop();return}running=true;start=performance.now()-t*1000;play.textContent='暂停';raf=requestAnimationFrame(tick)};seek.oninput=()=>{stop();t=+seek.value;draw()};document.querySelector('#background').onchange=e=>{const s=document.querySelector('#stage');s.style.backgroundImage=e.target.value==='grid'?'':'none';s.style.backgroundColor=e.target.value==='dark'?'#162543':e.target.value==='white'?'#FFFFFF':'#bfc4cc'};film.ready.then(draw);window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();play.click()}else if(e.code==='ArrowRight'||e.code==='ArrowLeft'){stop();t=Math.max(0,Math.min(5,t+(e.code==='ArrowRight'?1:-1)/60));draw()}});
</script></body></html>
