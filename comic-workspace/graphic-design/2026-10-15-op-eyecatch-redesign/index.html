<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新世界之魔物猎手 — OTHER SIDE / 新动效</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1425;color:#f4f3e9;font:14px system-ui,'Microsoft YaHei',sans-serif}header{max-width:1440px;margin:auto;padding:32px 24px 22px;display:flex;align-items:end;justify-content:space-between}h1{font-size:22px;letter-spacing:1px;margin:8px 0}header small{color:#86a5d4;font-size:11px;letter-spacing:3px}header p{color:#9aacbe;font-size:13px;margin:8px 0 0}.film{max-width:1392px;margin:auto;background:#fcfcf7;line-height:0;box-shadow:0 22px 70px #0005}canvas{width:100%;height:auto;aspect-ratio:16/9}.controls{max-width:1392px;margin:0 auto;padding:22px 0 34px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select,a.download{border:1px solid #334361;background:#17253c;color:#cbd8ed;border-radius:7px;padding:11px 17px;font:inherit;text-decoration:none;cursor:pointer}button.active{background:#216ae1;color:white;border-color:#216ae1}#play{background:#e2ff8a;color:#13294b;min-width:90px;border:0}input{flex:1;min-width:200px;accent-color:#8fc4ff}#clock{font-variant-numeric:tabular-nums;color:#9db2ce}footer{max-width:1392px;margin:auto;border-top:1px solid #26354b;color:#8c9eb5;padding:24px 0 40px;line-height:1.9}footer strong{color:#d8e6f8}a{color:#9fcbff}@media(max-width:1440px){.controls,footer{margin-left:24px;margin-right:24px}}.badge{font-size:11px;color:#a7bee0;letter-spacing:2px}
</style></head><body><header><div><small>OTHER SIDE / VERSION 02</small><h1>新世界之魔物猎手 · 第二版</h1><p>供现有 OP 叠加的圆环标题与成对中插</p></div><div class="badge">3840 × 2160 / 60 FPS</div></header><div class="film"><canvas id="film" width="1920" height="1080"></canvas></div><div class="controls"><button class="active" data-kind="overlay">圆环标题 · 5s</button><button data-kind="pause">中插 A · 休息</button><button data-kind="resume">中插 B · 继续</button><button id="play">播放</button><input id="seek" type="range" min="0" max="5" step="0.0166667" value="2.8"><span id="clock">2.80 / 5.00</span><button id="sound">声音：开</button><button id="full">全屏</button></div><footer><strong>第二版：圆环标题、中插与原创音效。</strong><br>标题：圆环展开 → 字形环绕 → 汇聚 → 停留 → 回环退场。中插 A 收起世界，中插 B 从同一颗星重新打开。<br><a href="watch.html">播放编码成片</a> · <a href="exports/Title-overlay-4K60-alpha.mov">圆环标题透明 MOV</a> · <a href="exports/Eyecatch-A-break-4K60.mp4">中插 A 4K 成片</a> · <a href="exports/Eyecatch-B-continue-4K60.mp4">中插 B 4K 成片</a> · <a href="README.md">第二版说明</a></footer>
<script src="motion.js"></script><script>
let kind='overlay',time=2.8,playing=false,origin=0,raf,audio=new Audio(),sound=true;const seek=document.querySelector('#seek'),clock=document.querySelector('#clock'),play=document.querySelector('#play');
function paint(){film.render(kind,time,1920,1080);seek.value=time;clock.textContent=`${time.toFixed(2)} / ${film.duration[kind].toFixed(2)}`}
function stop(){playing=false;cancelAnimationFrame(raf);audio.pause();play.textContent='播放'}
function tick(now){if(!playing)return;time=(now-origin)/1000;if(time>=film.duration[kind]){time=film.duration[kind]-.0001;paint();stop();return}paint();raf=requestAnimationFrame(tick)}
play.onclick=async()=>{await film.ready;if(playing){stop();return}if(time>=film.duration[kind]-.05)time=0;playing=true;origin=performance.now()-time*1000;if(kind!=='overlay'){audio.currentTime=time;if(sound)audio.play().catch(()=>{})}play.textContent='暂停';raf=requestAnimationFrame(tick)};
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=async()=>{stop();kind=b.dataset.kind;time=0;seek.max=film.duration[kind];document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));if(kind!=='overlay')audio.src=`audio/${kind}.wav`;else audio.removeAttribute('src');await film.ready;paint();play.click()});
seek.oninput=()=>{stop();time=Number(seek.value);paint()};document.querySelector('#sound').onclick=e=>{sound=!sound;audio.muted=!sound;e.target.textContent='声音：'+(sound?'开':'关')};document.querySelector('#full').onclick=()=>document.querySelector('.film').requestFullscreen();film.ready.then(paint);
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();play.click()}if(e.code==='ArrowRight'||e.code==='ArrowLeft'){stop();time=Math.max(0,Math.min(film.duration[kind]-.001,time+(e.code==='ArrowRight'?1:-1)/60));paint()}});
</script></body></html>
